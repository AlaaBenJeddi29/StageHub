<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="card shadow">
        <div class="card-header bg-primary text-white text-white text-center py-4">
          <i class="bi bi-person-circle fs-1"></i>
          <h3 class="mb-0 mt-2">{{ user.role === 'student' ? 'Student' : 'Company' }} Profile</h3>
        </div>

        <div class="card-body p-5">
          <div *ngIf="!editing; else editMode">
            <div class="row mb-3">
              <div class="col-sm-4 fw-bold">Name</div>
              <div class="col-sm-8">{{ user.name }}</div>
            </div>
            <div class="row mb-3">
              <div class="col-sm-4 fw-bold">Email</div>
              <div class="col-sm-8">{{ user.email }}</div>
            </div>
            <div class="row mb-4">
              <div class="col-sm-4 fw-bold">Role</div>
              <div class="col-sm-8">
                <span class="badge bg-{{ user.role === 'student' ? 'info' : 'dark' }} fs-6">
                  {{ user.role | titlecase }}
                </span>
              </div>
            </div>

            <button class="btn btn-outline-primary me-3" (click)="toggleEdit()">Edit Profile</button>
            <button class="btn btn-outline-danger" (click)="logout()">Logout</button>
          </div>

          <ng-template #editMode>
            <form [formGroup]="editForm" (ngSubmit)="onUpdate()">
              <div class="mb-3">
                <label class="form-label">{{ user.role === 'student' ? 'Full Name' : 'Company Name' }}</label>
                <input type="text" class="form-control" formControlName="name">
              </div>
              <div class="mb-4">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" formControlName="email">
              </div>
              <button type="submit" class="btn btn-success me-3">Save Changes</button>
              <button type="button" class="btn btn-secondary" (click)="toggleEdit()">Cancel</button>
            </form>
          </ng-template>

          <div *ngIf="error" class="alert alert-danger mt-4">{{ error }}</div>
        </div>
      </div>
    </div>
  </div>
</div>
