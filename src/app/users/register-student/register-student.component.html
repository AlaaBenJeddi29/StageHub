<!-- src/app/users/register-student/register-student.component.html -->
<div class="min-vh-100 d-flex align-items-center justify-content-center bg-light py-5 px-3">
  <div class="card border-0 shadow-lg" style="max-width: 520px; width: 100%; border-radius: 2rem;">
    
    <!-- Header -->
    <div class="card-header text-white text-center py-5" 
         style="background: linear-gradient(135deg, #28a745, #20c997); border-radius: 2rem 2rem 0 0;">
      <i class="bi bi-mortarboard-fill fs-1 mb-3"></i>
      <h3 class="mb-0 fw-bold">Join as Student</h3>
      <p class="mb-0 opacity-90">Start your internship journey today!</p>
    </div>

    <div class="card-body p-5">

      <!-- Messages -->
      <div *ngIf="success" class="alert alert-success text-center rounded-4">
        <i class="bi bi-check-circle-fill me-2"></i>{{ success }}
      </div>
      <div *ngIf="error" class="alert alert-danger text-center rounded-4">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error }}
      </div>

      <!-- Loading -->
      <div *ngIf="loading" class="text-center py-5">
        <div class="spinner-border text-success" style="width: 4rem; height: 4rem;"></div>
        <p class="mt-3 text-muted">Creating your account...</p>
      </div>

      <!-- Form -->
      <form *ngIf="!loading && !success" [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="mt-4">

        <!-- Profile Image Upload -->
        <div class="text-center mb-5">
          <div class="position-relative d-inline-block">
            <img 
              [src]="previewImage || 'https://upload.wikimedia.org/wikipedia/commons/8/89/Portrait_Placeholder.png'"
              class="rounded-circle shadow-lg border border-5 border-white"
              width="140" height="140"
              alt="Profile preview"
              style="object-fit: cover; cursor: pointer;"
              (click)="imageInput.click()">
            <div class="position-absolute bottom-0 end-0 bg-success text-white rounded-circle p-3 shadow"
                 style="cursor: pointer;" (click)="imageInput.click()">
              <i class="bi bi-camera-fill fs-4"></i>
            </div>
          </div>
          <input #imageInput type="file" class="d-none" accept="image/*" (change)="onImageSelected($event)">
          <p class="mt-3 text-muted small">Click to add your photo (optional)</p>
        </div>

        <!-- Form Fields -->
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label fw-bold">Full Name</label>
            <input type="text" class="form-control form-control-lg rounded-pill" formControlName="name" placeholder="John Doe">
          </div>

          <div class="col-12">
            <label class="form-label fw-bold">Email</label>
            <input type="email" class="form-control form-control-lg rounded-pill" formControlName="email" placeholder="john@university.edu">
          </div>

          <div class="col-12">
            <label class="form-label fw-bold">Password</label>
            <input type="password" class="form-control form-control-lg rounded-pill" formControlName="password" placeholder="Min 6 characters">
          </div>

          <div class="col-12">
            <label class="form-label fw-bold">
              Skills (comma separated)
              <small class="text-success d-block">This powers smart matching!</small>
            </label>
            <input type="text" class="form-control form-control-lg rounded-pill" formControlName="skills"
                   placeholder="Angular, React, Python, Git">
          </div>

          <div class="col-md-6">
            <label class="form-label fw-bold">Education</label>
            <input type="text" class="form-control form-control-lg rounded-pill" formControlName="education" placeholder="Computer Science">
          </div>

          <div class="col-md-6">
            <label class="form-label fw-bold">Phone</label>
            <input type="text" class="form-control form-control-lg rounded-pill" formControlName="phone" placeholder="+213 555 123 456">
          </div>

          <div class="col-12">
            <label class="form-label fw-bold">Experience (optional)</label>
            <textarea class="form-control rounded-3" formControlName="experience" rows="3"
                      placeholder="e.g., 1 year freelance, built 3 apps..."></textarea>
          </div>
        </div>

        <button type="submit"
                class="btn btn-success btn-lg w-100 mt-5 fw-bold rounded-pill shadow"
                [disabled]="registerForm.invalid || loading">
          Create Student Account
        </button>
      </form>

      <div class="text-center mt-4">
        <small class="text-muted">
          Already have an account? 
          <a routerLink="/users/login" class="fw-bold text-success">Login here</a>
        </small>
      </div>
    </div>
  </div>
</div>
