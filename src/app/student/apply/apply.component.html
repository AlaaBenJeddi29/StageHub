<!-- src/app/student/apply/apply.component.html -->
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-8 col-xl-6">
      <div class="card shadow-lg border-0">
        <div class="card-header bg-primary text-white text-center py-4">
          <h3 class="mb-0">Apply for Internship</h3>
        </div>

        <div class="card-body p-5">
          <!-- Success Message -->
          <div *ngIf="success" class="alert alert-success d-flex align-items-center">
            <i class="bi bi-check-circle-fill me-2"></i>
            {{ success }}
          </div>

          <!-- Error Message -->
          <div *ngIf="error" class="alert alert-danger d-flex align-items-center">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            {{ error }}
          </div>

          <!-- Loading -->
          <div *ngIf="loading" class="text-center py-4">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Submitting...</span>
            </div>
            <p class="mt-3 text-muted">Sending your application...</p>
          </div>

          <!-- Form (only show if not loading) -->
          <form *ngIf="!loading" [formGroup]="applyForm" (ngSubmit)="onSubmit()">
            <div class="mb-4">
              <label class="form-label fw-bold">
                <i class="bi bi-chat-left-text me-2"></i>
                Cover Message
              </label>
              <textarea
                class="form-control"
                formControlName="message"
                rows="6"
                placeholder="Tell the company why you're the perfect fit..."
                [class.is-invalid]="applyForm.get('message')?.touched && applyForm.get('message')?.invalid"
              ></textarea>
              <div class="text-danger small mt-1" *ngIf="applyForm.get('message')?.touched && applyForm.get('message')?.invalid">
                Message is required
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label fw-bold">
                <i class="bi bi-file-earmark-arrow-up me-2"></i>
                Upload Your CV (PDF only)
              </label>
              <input
                type="file"
                class="form-control"
                accept=".pdf"
                (change)="onFileSelect($event)"
                [class.is-invalid]="fileError"
                #fileInput
              >
              <div class="form-text">
                Max 5MB • PDF format only
              </div>
              <div class="text-danger small mt-1" *ngIf="fileError">
                {{ fileError }}
              </div>

              <!-- Show selected file name -->
              <div *ngIf="selectedFileName" class="mt-2 p-3 bg-light rounded d-flex align-items-center">
                <i class="bi bi-file-earmark-pdf text-danger me-2"></i>
                <strong>{{ selectedFileName }}</strong>
              </div>
            </div>

            <div class="d-grid gap-3">
              <button
                type="submit"
                class="btn btn-success btn-lg fw-bold"
                [disabled]="applyForm.invalid || !selectedFile || loading"
              >
                <i class="bi bi-send me-2"></i>
                Submit Application
              </button>

              <button
                type="button"
                class="btn btn-outline-secondary"
                (click)="router.navigate(['/student/offers', offerId])"
              >
                ← Back to Offer
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
