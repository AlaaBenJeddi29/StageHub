<!-- src/app/users/profile/profile.component.html -->
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="card shadow-lg border-0">
        <div class="card-header bg-gradient bg-primary text-white text-center py-5">
          <i class="bi bi-person-circle fs-1 mb-3"></i>
          <h2 class="mb-0">Welcome back, {{ user.name }}!</h2>
          <p class="mb-0 mt- mt-2">
            <span class="badge bg-light text-dark fs-6 px-3 py-2">
              {{ user.role === 'student' ? 'Student' : 'Company' }}
            </span>
          </p>
        </div>

        <div class="card-body p-5 text-center">
          <p class="lead text-muted mb-4">
            You're logged in and ready to go!
          </p>

          <!-- STUDENT DASHBOARD BUTTON -->
          <div *ngIf="user.role === 'student'" class="d-grid gap-3">
            <a routerLink="/student/offers" class="btn btn-success btn-lg fw-bold">
              <i class="bi bi-search me-2"></i>
              Browse All Internships
            </a>
            <a routerLink="/student/candidatures" class="btn btn-outline-primary btn-lg">
              <i class="bi bi-file-earmark-check me-2"></i>
              My Applications
            </a>
          </div>

          <!-- COMPANY DASHBOARD BUTTON -->
          <div *ngIf="user.role === 'company'" class="d-grid gap-3">
            <a routerLink="/company/offers" class="btn btn-dark btn-lg fw-bold">
              <i class="bi bi-building me-2"></i>
              Manage My Offers
            </a>
            <a routerLink="/company/offers/new" class="btn btn-success btn-lg">
              <i class="bi bi-plus-circle me-2"></i>
              Post New Internship
            </a>
          </div>

          <hr class="my-4">

          <div class="d-flex justify-content-center gap-3">
            <button class="btn btn-outline-secondary" (click)="toggleEdit()">
              <i class="bi bi-pencil-square me-2"></i>Edit Profile
            </button>
            <button class="btn btn-outline-danger" (click)="logout()">
              <i class="bi bi-box-arrow-right me-2"></i>Logout
            </button>
          </div>
        </div>
      </div>

      <!-- Edit Form (hidden by default) -->
      <div class="card mt-4" *ngIf="editing">
        <div class="card-body">
          <h5>Edit Profile</h5>
          <form [formGroup]="editForm" (ngSubmit)="onUpdate()">
            <div class="mb-3">
              <input class="form-control" formControlName="name" placeholder="Name">
            </div>
            <div class="mb-3">
              <input class="form-control" formControlName="email" placeholder="Email">
            </div>
            <button type="submit" class="btn btn-primary me-2">Save</button>
            <button type="button" class="btn btn-secondary" (click)="toggleEdit()">Cancel</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
