<!-- src/app/users/register-company/register-company.component.html -->
<div class="min-vh-100 d-flex align-items-center justify-content-center bg-gradient-light py-5 px-3">
  <div class="card border-0 shadow-xl overflow-hidden" style="max-width: 560px; width: 100%; border-radius: 2rem;">
    
    <!-- Header -->
    <div class="card-header text-white text-center py-5 position-relative"
         style="background: linear-gradient(135deg, #2c3e50, #34495e); border-radius: 2rem 2rem 0 0;">
      <i class="bi bi-building-fill fs-1 mb-3 d-block"></i>
      <h2 class="fw-bold mb-2">Welcome, Innovators!</h2>
      <p class="mb-0 opacity-90">Post internships & hire the best talent</p>
    </div>

    <div class="card-body p-5">

      <!-- Messages -->
      <div *ngIf="success" class="alert alert-success text-center rounded-4 shadow-sm border-0">
        <i class="bi bi-check-circle-fill fs-4 me-2"></i>{{ success }}
      </div>
      <div *ngIf="error" class="alert alert-danger text-center rounded-4 shadow-sm border-0">
        <i class="bi bi-exclamation-triangle-fill fs-4 me-2"></i>{{ error }}
      </div>

      <!-- Loading -->
      <div *ngIf="loading" class="text-center py-5">
        <div class="spinner-border text-primary" style="width: 4rem; height: 4rem;"></div>
        <p class="mt-3 text-muted fw-medium">Setting up your company profile...</p>
      </div>

      <!-- Form -->
      <form *ngIf="!loading && !success" [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="mt-4">

        <!-- Company Logo Upload -->
        <div class="text-center mb-5">
          <div class="position-relative d-inline-block">
            <img 
              [src]="previewImage || 'https://www.largeherds.co.za/wp-content/uploads/2024/01/logo-placeholder-image.png'"
              class="rounded shadow-lg border border-5 border-white"
              width="160" height="160"
              alt="Company Logo"
              style="object-fit: contain; background: #f8f9fa; cursor: pointer;"
              (click)="logoInput.click()">
            <div class="position-absolute bottom-0 end-0 bg-primary text-white rounded-circle p-3 shadow-lg"
                 style="cursor: pointer;" (click)="logoInput.click()">
              <i class="bi bi-camera-fill fs-4"></i>
            </div>
          </div>
          <input #logoInput type="file" class="d-none" accept="image/*" (change)="onImageSelected($event)">
          <p class="mt-3 text-muted small">Click to upload company logo (recommended)</p>
        </div>

        <div class="row g-3">
          <div class="col-12">
            <label class="form-label fw-bold text-dark">Company Name</label>
            <div class="input-group input-group-lg">
              <span class="input-group-text bg-light border-0"><i class="bi bi-building"></i></span>
              <input type="text" class="form-control rounded-pill ps-3" formControlName="name"
                     placeholder="Acme Technologies">
            </div>
          </div>

          <div class="col-12">
            <label class="form-label fw-bold text-dark">Email Address</label>
            <div class="input-group input-group-lg">
              <span class="input-group-text bg-light border-0"><i class="bi bi-envelope-fill"></i></span>
              <input type="email" class="form-control rounded-pill ps-3" formControlName="email"
                     placeholder="hr@acme.com">
            </div>
          </div>

          <div class="col-12">
            <label class="form-label fw-bold text-dark">Password</label>
            <div class="input-group input-group-lg">
              <span class="input-group-text bg-light border-0"><i class="bi bi-lock-fill"></i></span>
              <input type="password" class="form-control rounded-pill ps-3" formControlName="password"
                     placeholder="Minimum 6 characters">
            </div>
          </div>

          <div class="col-md-6">
            <label class="form-label fw-bold text-dark">Industry</label>
            <input type="text" class="form-control form-control-lg rounded-pill" formControlName="industry"
                   placeholder="e.g., Software, Finance">
          </div>

          <div class="col-md-6">
            <label class="form-label fw-bold text-dark">Company Size</label>
            <select class="form-select form-select-lg rounded-pill" formControlName="size">
              <option value="">Select size</option>
              <option>1-10 employees</option>
              <option>11-50 employees</option>
              <option>51-200 employees</option>
              <option>201-500 employees</option>
              <option>500+ employees</option>
            </select>
          </div>

          <div class="col-12">
            <label class="form-label fw-bold text-dark">Website (optional)</label>
            <input type="url" class="form-control form-control-lg rounded-pill" formControlName="website"
                   placeholder="https://acme.com">
          </div>

          <div class="col-12">
            <label class="form-label fw-bold text-dark">Short Description</label>
            <textarea class="form-control rounded-3" formControlName="description" rows="3"
                      placeholder="We build amazing products and love fresh talent!"></textarea>
          </div>
        </div>

        <button type="submit"
                class="btn btn-dark btn-lg w-100 mt-5 fw-bold rounded-pill shadow-lg d-flex align-items-center justify-content-center gap-2"
                [disabled]="registerForm.invalid || loading">
          <i class="bi bi-building-add"></i>
          Create Company Account
        </button>
      </form>

      <div class="text-center mt-4">
        <small class="text-muted">
          Already have an account? 
          <a routerLink="/users/login" class="fw-bold text-primary">Login here</a>
        </small>
      </div>
    </div>
  </div>
</div>
